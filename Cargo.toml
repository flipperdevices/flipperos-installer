[package]
name = "flipperos-installer"
version = "0.1.0"
edition = "2021"
description = "On-device installer for Rockchip RK3576 FlipperOS boards, run from initramfs."
license = "MIT"
readme = "README.md"

# The installer runs from a minimal initramfs, so keep the release profile
# aggressive about binary size.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
# By default we ship both frontends so a single binary can drive the serial
# console (TUI) and the on-device screen (GUI) at the same time. Slim builds can
# select a single frontend, e.g. `--no-default-features --features tui`.
default = ["tui", "gui"]
tui = ["dep:cursive"]
gui = ["dep:slint", "dep:flipper-ui"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Small, rustls-based HTTP client so we avoid a system OpenSSL dependency.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
log = "0.4"
# Pure-Rust GPT partitioning so we don't need to ship sgdisk (and its libstdc++)
# in the initramfs.
gpt = "4"
# Random partition GUIDs for the GPT entries.
uuid = { version = "1", features = ["v4"] }
# Human-editable Btrfs layout config.
toml = "0.8"
# libzstd-backed decompressor for the snapshot packs. zstd-sys compiles the
# vendored C library straight into the binary (no runtime .so; needs a C
# compiler at build time), and is much faster than a pure-Rust decoder.
zstd = "0.13"
# Tar reader for locally supplied `*.tar.zst` update bundles. `default-features
# = false` drops the `xattr` feature: we unpack plain files into a scratch dir
# and never want extended attributes (nor the extra dependency) — do not
# "restore" the default features here.
tar = { version = "0.4", default-features = false }
# SHA-256 for verifying bundle artifacts against their manifest. `ring` is
# already compiled and linked into the binary by ureq's rustls, so depending on
# it directly costs no extra code size, and it uses the ARMv8 SHA-2 extensions
# on the RK3576. All hashing goes through `core::fetch::Sha256`, so swapping to
# `sha2` (should a future rustls drop ring) is a change in one place.
ring = "0.17"
# statvfs(3) for the free-space precheck before staging ~1 GiB of artifacts.
# Already in the dependency graph via zstd-sys.
libc = "0.2"

# TUI frontend (serial console / any terminal).
[dependencies.cursive]
version = "0.21"
default-features = false
features = ["crossterm-backend"]
optional = true

# GUI frontend for the Flipper One DRM/KMS screen. No backend: we drive the panel
# and the buttons ourselves through `flipper-ui`, so the software renderer is
# taken on its own. Any `backend-linuxkms*` feature would compile
# `i-slint-backend-linuxkms`, whose `input` (libinput + libudev) and `xkbcommon`
# dependencies are not optional and cannot be turned off by feature selection —
# four shared libraries in the initramfs to service thirteen soldered buttons.
#
# `std` used to arrive implied by the backend feature and has to be named now;
# without it `i-slint-core` builds no_std. `unsafe-single-threaded` is what
# `flipper-ui` asks for, and Cargo unifies features, so we get it whether or not
# it appears here: name it, because it is a constraint on our own code. Nothing
# may hold a Slint handle off the thread that owns the window.
[dependencies.slint]
version = "1.8"
default-features = false
features = ["compat-1-2", "renderer-software", "std", "unsafe-single-threaded"]
optional = true

# The panel, the buttons and the Slint glue, shared with flipctl and the Falcon
# boot menu so all three draw the same screen the same way. `device` is the DRM
# sink and the raw evdev source; `slint` is the software-renderer platform.
# `screens` is deliberately absent: it compiles flipctl's own screens, and we
# draw our own.
#
# This is also what takes libfontconfig off the link line. It depends on
# `i-slint-common` with `fontconfig-dlopen`, a feature the `slint` facade does
# not re-export, which switches fontique's binding from link-time to `dlopen`.
# Pinned by revision rather than branch: this binary ships in an initramfs and
# has to rebuild identically from the tag.
[dependencies.flipper-ui]
git = "https://github.com/flipperdevices/flipctl-slint"
rev = "7e8fd5e428c2016f26c81167025a602f8eb22b2c"
default-features = false
features = ["device", "slint"]
optional = true

# Off-device visual testing: render the GUI through the same Slint software
# renderer used on-device and save PNGs. Only pulled in for the screenshot
# example, so it never touches the shipped initramfs binary.
[dev-dependencies]
png = "0.17"

[[example]]
name = "gui_screenshot"
required-features = ["gui"]

